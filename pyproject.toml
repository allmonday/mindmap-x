[project]
name = "agent-mindmap"
version = "0.1.0"
description = "人 + AI Agent 协同脑图工具：Human 浏览器编辑 / Agent CLI·MCP·REST 读写 / WebSocket 实时互见"
requires-python = ">=3.12"
dependencies = [
    "nexusx[cli,fastmcp]>=6,<7",
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "aiosqlite",
    "alembic>=1.13",
    "strands-agents[openai]>=1.53.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
