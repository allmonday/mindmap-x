[project]
name = "agent-mindmap"
version = "0.1.0"
description = "人 + AI Agent 协同脑图工具：Human 浏览器编辑 / Agent CLI·MCP·REST 读写 / WebSocket 实时互见"
license = "BUSL-1.1"
requires-python = ">=3.12"
dependencies = [
    "nexusx[cli,fastmcp]>=6,<7",
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "aiosqlite",
    "alembic>=1.13",
    "strands-agents[openai]>=1.53.0",
    # sqlalchemy 的 greenlet 依赖标记漏了 macOS arm64（platform_machine=='arm64'），
    # async 引擎运行时必需，显式声明防止 uv 按标记剔除
    "greenlet>=3",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]
desktop = ["pywebview>=6", "platformdirs>=4", "pyinstaller>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
