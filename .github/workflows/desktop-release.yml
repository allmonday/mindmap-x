name: Desktop Release

# 桌面版构建与发布：tag v* 触发（也可手动），产物发 GitHub Releases。
# macOS arm64 + Windows x64（Win 11：WebView2 系统自带；未签名——SmartScreen
# 首次运行会拦，点"仍要运行"）。macOS 未签名首次打开需 xattr -cr。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version guard  # tag 版本必须与 pyproject 一致（版本唯一事实源），防漂移
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 pyproject.toml version $PKG 不一致——先改 pyproject 再打对应 tag"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: fe
        run: |
          npm ci
          npm run build   # 产出 src/static

      - name: Sync dependencies
        run: uv sync --frozen --extra desktop

      - name: PyInstaller
        run: uv run pyinstaller desktop.spec --noconfirm

      - name: Smoke test  # 产物自检：迁移 + 起服 + 探活，失败即中止发布
        env:
          MINDMAPX_DATA_DIR: ${{ runner.temp }}/mmx-smoke
        run: dist/MindMapX.app/Contents/MacOS/MindMapX --smoke

      - name: Package  # DMG（UDZO 压缩）；hdiutil 打 .app 天然保留权限与 symlink
        run: |
          hdiutil create -volname "MindMap X" -srcfolder dist/MindMapX.app \
            -ov -format UDZO MindMapX-macOS-arm64.dmg
          shasum -a 256 MindMapX-macOS-arm64.dmg > MindMapX-macOS-arm64.dmg.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MindMapX-macOS-arm64.dmg
            MindMapX-macOS-arm64.dmg.sha256

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version guard
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 pyproject.toml version $PKG 不一致"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: fe
        run: |
          npm ci
          npm run build

      - name: Sync dependencies
        run: uv sync --frozen --extra desktop

      - name: PyInstaller
        run: uv run pyinstaller desktop.spec --noconfirm

      - name: Smoke test  # 同 macOS：迁移 + 起服 + 探活（GUI 后端不在此路径）
        env:
          MINDMAPX_DATA_DIR: ${{ runner.temp }}/mmx-smoke
        shell: bash
        run: dist/MindMapX/MindMapX.exe --smoke

      - name: Package  # onedir 打 zip（解压即用，免安装）
        shell: bash
        run: |
          cd dist && 7z a -tzip ../MindMapX-Windows-x64.zip MindMapX && cd ..
          sha256sum MindMapX-Windows-x64.zip > MindMapX-Windows-x64.zip.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MindMapX-Windows-x64.zip
            MindMapX-Windows-x64.zip.sha256
